[package]
name = "spdm-attest"
version = "0.1.0"
edition = "2021"
authors = ["Abhrankan Chakrabarti <abhrankan2000@gmail.com>"]
description = "Hardware-rooted PCIe SPDM 1.2/1.3 attestation quote and measurement validator for Confidential GPU computing."
license = "MIT"
repository = "https://github.com/foxhackerzdevs/spdm-attest"
readme = "README.md"
keywords = ["spdm", "attestation", "confidential", "tee", "gpu"]
categories = ["cryptography", "command-line-utilities", "hardware-support"]

[lib]
name = "spdm_attest"
path = "src/lib.rs"

[[bin]]
name = "spdm-attest"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
p384 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
thiserror = "2.0"
hex = "0.4"
byteorder = "1.5"
rand = "0.8"
rcgen = "0.13"
x509-parser = { version = "0.16", features = ["verify"] }
